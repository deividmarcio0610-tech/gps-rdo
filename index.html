<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover usa a tela inteira do iPhone; o CSS trata as áreas seguras.
     maximum-scale=1 impede o iPhone de ampliar ao tocar num campo (o pinça continua) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>GPS-RDO</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#FF5722" />
<meta name="description" content="Relatório Diário de Obra: cabeçalho, mão de obra, equipamentos, tarefas, ocorrências, fotos e PDF." />
<meta name="application-name" content="GPS-RDO" />

<!-- iOS: instalado pela tela de início, em tela cheia -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GPS-RDO" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="iconbtn" id="btn-back" aria-label="Voltar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title" id="screen-title">Selecione a Ação</div>
    <button class="report-link" id="btn-report-top">RELATÓRIO</button>
  </header>
  <main id="screen"></main>
  <div class="install-slot" id="install-slot"></div>
  <div class="theme-toggle" id="theme-slot"></div>
  <footer class="brand"><span><span class="fg">GPS</span>-<span class="rdo">RDO</span></span></footer>
</div>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="js/store.js"></script>
<script src="js/fotos.js"></script>
<script src="js/ui.js"></script>
<script src="js/conta.js"></script>
<script src="js/logo.js"></script>
<script src="js/pdf.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/screens.js"></script>
<script src="js/pwa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
